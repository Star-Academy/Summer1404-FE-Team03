@for (book of books; track book.id) {
  <div class="books-info">
    <h2>{{ book.name }}</h2>
    <img [src]="book.image" alt="{{ book.image }}" />

    <div class="book-details">
      <p>Author: {{ book.author }}</p>
      <div class="genres">
        @for (g of book.genre; track g ) {
          <span class="genre-tag">{{ g }}</span>
        }
      </div>
      <p>Published: {{ book.publishData | date: 'longDate' }}</p>
      <div class="price-container">
        <p>Price:</p>
        <span class="price"> ${{ book.price }}</span>
      </div>

      <button class="details-button" (click)="onViewDetails(book.id)">
        View Details
      </button>
      <button class="details-button" (click)="onEditClick(book.id)">
        Edit
      </button>
      <button class="details-button" (click)="onDeleteClick(book.id)">
        Delete
      </button>



    </div>
  </div>
}
